# Deploys the web build in demo mode (built-in sample data, no sign-in) to
# GitHub Pages on every push to main. No secrets are used.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
# Actions are pinned to exact release tags, as in ci.yml.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time; a queued run waits instead of cancelling a
# deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build:
    name: Build web demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2.18.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Build
        # The site is served from /<repo>/, so the base href must match.
        run: >-
          flutter build web --release
          --dart-define=DEMO_MODE=true
          --base-href "/${{ github.event.repository.name }}/"
      - name: SPA fallback
        # GitHub Pages has no rewrites; serve the app for unknown paths too.
        run: cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: app/build/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
